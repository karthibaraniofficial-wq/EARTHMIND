<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3354"/>
      <stop offset="100%" stop-color="#071A2B"/>
    </linearGradient>
    <linearGradient id="fav-orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C8C8"/>
      <stop offset="50%" stop-color="#27C98A"/>
      <stop offset="100%" stop-color="#9B7CFF"/>
    </linearGradient>
    <linearGradient id="fav-bio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27C98A"/>
      <stop offset="100%" stop-color="#18C8C8"/>
    </linearGradient>
  </defs>

  <!-- Core Planetary Sphere -->
  <circle cx="50" cy="50" r="34" fill="url(#fav-bg)" stroke="#18C8C8" stroke-width="2.5"/>

  <!-- Equatorial Grid Line -->
  <path d="M 16,50 Q 50,60 84,50" stroke="#18C8C8" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Meridian Biosphere Arc -->
  <path d="M 50,16 C 32,30 32,70 50,84" stroke="url(#fav-bio)" stroke-width="3" stroke-linecap="round"/>

  <!-- Neural Telemetry Lines -->
  <line x1="50" y1="16" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="81" y2="39" stroke="#18C8C8" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="50" y1="50" x2="25" y2="73" stroke="#9B7CFF" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- High-Contrast Orbital Front Arc -->
  <path d="M 84,32 C 98,47 79,76 48,80 C 20,84 6,67 16,34" stroke="url(#fav-orbit)" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Neural Intelligence Nodes (Calibrated for high visibility at 16-32px) -->
  <circle cx="50" cy="50" r="4.5" fill="#27C98A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="50" cy="16" r="3" fill="#FFFFFF"/>
  <circle cx="81" cy="39" r="3.5" fill="#18C8C8"/>
  <circle cx="25" cy="73" r="3.5" fill="#9B7CFF"/>
</svg>
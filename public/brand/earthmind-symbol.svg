<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="em-sym-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3354"/>
      <stop offset="100%" stop-color="#071A2B"/>
    </linearGradient>
    <linearGradient id="em-sym-orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C8C8"/>
      <stop offset="50%" stop-color="#27C98A"/>
      <stop offset="100%" stop-color="#9B7CFF"/>
    </linearGradient>
    <linearGradient id="em-sym-bio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27C98A"/>
      <stop offset="50%" stop-color="#18C8C8"/>
      <stop offset="100%" stop-color="#0E8686"/>
    </linearGradient>
    <filter id="em-sym-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Satellite Telemetry Ring (Sensor Horizon) -->
  <circle cx="50" cy="50" r="45" stroke="#18C8C8" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- Orbital Ring: Back Arc (Passes Behind Planet with Depth) -->
  <path d="M 18,36 C 26,22 64,20 82,34" stroke="#18C8C8" stroke-width="1.4" stroke-opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Core Planetary Sphere -->
  <circle cx="50" cy="50" r="32" fill="url(#em-sym-bg)" stroke="#18C8C8" stroke-width="1.8"/>

  <!-- Atmospheric Limb Reflection Arc -->
  <path d="M 23,38 A 32 32 0 0 1 77,38" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.65"/>

  <!-- Equatorial Grid Line -->
  <path d="M 18,50 Q 50,59 82,50" stroke="#18C8C8" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Meridian Biosphere Arc (Living Biosphere Curvature) -->
  <path d="M 50,18 C 34,30 34,70 50,82" stroke="url(#em-sym-bio)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Neural Geodesic Connectors (AI Intelligence Mesh) -->
  <line x1="50" y1="18" x2="50" y2="50" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2,1.5"/>
  <line x1="50" y1="50" x2="79" y2="40" stroke="#18C8C8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="27" y2="72" stroke="#9B7CFF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Orbital Ring: Front Arc (Sweeps Over Planet) -->
  <path d="M 82,34 C 95,48 78,74 48,78 C 22,82 8,66 18,36" stroke="url(#em-sym-orbit)" stroke-width="2.8" stroke-linecap="round" filter="url(#em-sym-glow)"/>

  <!-- Neural Intelligence Nodes -->
  <!-- Center Synthesis Core Node -->
  <circle cx="50" cy="50" r="3.4" fill="#27C98A" stroke="#FFFFFF" stroke-width="1"/>
  <!-- North Polar Sensor Node -->
  <circle cx="50" cy="18" r="2.2" fill="#FFFFFF"/>
  <!-- East Orbital Vertex Node -->
  <circle cx="79" cy="40" r="2.8" fill="#18C8C8"/>
  <!-- South-West Ground Station Node -->
  <circle cx="27" cy="72" r="2.8" fill="#9B7CFF"/>
</svg>

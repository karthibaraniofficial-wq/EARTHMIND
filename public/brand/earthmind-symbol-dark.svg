  <!-- Intelligence Nodes -->
  <circle cx="50" cy="50" r="3.5" fill="#0E8686"/>
  <circle cx="50" cy="18" r="2.2" fill="#071A2B"/>
  <circle cx="79" cy="40" r="2.8" fill="#071A2B"/>
  <circle cx="27" cy="72" r="2.8" fill="#071A2B"/>
</svg>

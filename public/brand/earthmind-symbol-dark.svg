<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Outer Telemetry Ring -->
  <circle cx="50" cy="50" r="45" stroke="#071A2B" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- Orbital Ring Back -->
  <path d="M 18,36 C 26,22 64,20 82,34" stroke="#071A2B" stroke-width="1.4" stroke-opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Planetary Sphere Core -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#071A2B" stroke-width="2.2"/>

  <!-- Atmospheric Limb -->
  <path d="M 23,38 A 32 32 0 0 1 77,38" stroke="#0E8686" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Equatorial Curve -->
  <path d="M 18,50 Q 50,59 82,50" stroke="#071A2B" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Meridian Biosphere Arc -->

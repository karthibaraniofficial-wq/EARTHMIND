  <line x1="50" y1="50" x2="79" y2="40" stroke="#071A2B" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="50" y1="50" x2="27" y2="72" stroke="#071A2B" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Front Orbital Ring -->

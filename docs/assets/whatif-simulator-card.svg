<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="auto">
  <defs>
    <linearGradient id="simCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051424"/>
      <stop offset="100%" stop-color="#081E32"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A243D"/>
      <stop offset="100%" stop-color="#081B2E"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18C8C8"/>
      <stop offset="100%" stop-color="#27C98A"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="400" rx="14" fill="url(#simCardBg)" stroke="rgba(24,200,200,0.2)" stroke-width="1.2"/>

  <!-- Section Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="150" height="24" rx="12" fill="#0D2C4A" stroke="rgba(255,209,102,0.3)" stroke-width="1"/>
    <text x="14" y="16" fill="#FFD166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SIMULATION LAB</text>
    <text x="166" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
      What-If Counterfactual Sandbox &amp; Coupled Biophysical Feedback
    </text>
  </g>

  <!-- Left: Sandbox Sliders / Counterfactual Inputs -->
  <g transform="translate(40, 85)">
    <rect width="360" height="275" rx="10" fill="url(#boxGrad)" stroke="rgba(24,200,200,0.2)" stroke-width="1"/>
    <text x="20" y="30" fill="#18C8C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
      01. COUNTERFACTUAL FORCING INPUTS
    </text>

    <!-- Slider 1: Tree Cover -->
    <g transform="translate(20, 52)">
      <text x="0" y="12" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Tree Canopy Expansion</text>
      <text x="320" y="12" text-anchor="end" fill="#27C98A" font-family="ui-monospace, monospace" font-size="11" font-weight="700">+20%</text>
      <rect x="0" y="18" width="320" height="6" rx="3" fill="#041220"/>
      <rect x="0" y="18" width="220" height="6" rx="3" fill="#27C98A"/>
      <circle cx="220" cy="21" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Slider 2: Urban Expansion -->
    <g transform="translate(20, 104)">
      <text x="0" y="12" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Urban Sprawl Regulation</text>
      <text x="320" y="12" text-anchor="end" fill="#9B7CFF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">-10%</text>
      <rect x="0" y="18" width="320" height="6" rx="3" fill="#041220"/>
      <rect x="0" y="18" width="130" height="6" rx="3" fill="#9B7CFF"/>
      <circle cx="130" cy="21" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Slider 3: Water Table Stress -->
    <g transform="translate(20, 156)">
      <text x="0" y="12" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Aquifer Depletion Abatement</text>
      <text x="320" y="12" text-anchor="end" fill="#4FA8FF" font-family="ui-monospace, monospace" font-size="11" font-weight="700">-15%</text>
      <rect x="0" y="18" width="320" height="6" rx="3" fill="#041220"/>
      <rect x="0" y="18" width="110" height="6" rx="3" fill="#4FA8FF"/>
      <circle cx="110" cy="21" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Slider 4: Clean Energy Transition -->
    <g transform="translate(20, 208)">
      <text x="0" y="12" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Renewable Energy Grid Share</text>
      <text x="320" y="12" text-anchor="end" fill="#FFD166" font-family="ui-monospace, monospace" font-size="11" font-weight="700">+35%</text>
      <rect x="0" y="18" width="320" height="6" rx="3" fill="#041220"/>
      <rect x="0" y="18" width="240" height="6" rx="3" fill="#FFD166"/>
      <circle cx="240" cy="21" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Center Arrow / Convergence Engine -->
  <g transform="translate(425, 175)">
    <!-- Engine Capsule -->
    <rect width="250" height="95" rx="8" fill="#072036" stroke="rgba(24,200,200,0.4)" stroke-width="1.2"/>
    <circle cx="28" cy="26" r="10" fill="#0C2B48" stroke="#18C8C8" stroke-width="1"/>
    <text x="28" y="30" text-anchor="middle" font-size="10">⚙️</text>
    <text x="46" y="30" fill="#18C8C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">02. COUPLED ENGINE</text>
    <text x="18" y="52" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Non-Linear Convergence Loop</text>
    <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Albedo • Evapotranspiration • Heat flux</text>
    
    <!-- Arrows -->
    <path d="M -20,48 L -4,48" stroke="#18C8C8" stroke-width="2"/>
    <path d="M 254,48 L 270,48" stroke="#27C98A" stroke-width="2"/>
  </g>

  <!-- Right: Projected Environmental Impact -->
  <g transform="translate(700, 85)">
    <rect width="360" height="275" rx="10" fill="url(#boxGrad)" stroke="rgba(39,201,138,0.25)" stroke-width="1"/>
    <text x="20" y="30" fill="#27C98A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
      03. PROJECTED MULTI-CRITERIA DELTAS
    </text>

    <!-- Metric 1: Health Score -->
    <g transform="translate(20, 48)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">PLANETARY HEALTH SCORE</text>
      <text x="0" y="36" fill="#27C98A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">79.4 / 100 <tspan fill="#27C98A" font-size="12">(+14.2 pt)</tspan></text>
      <rect x="220" y="20" width="100" height="18" rx="9" fill="rgba(39,201,138,0.15)"/>
      <text x="270" y="33" text-anchor="middle" fill="#27C98A" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">PROJECTED</text>
    </g>

    <!-- Metric 2: Heat Risk Index -->
    <g transform="translate(20, 102)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">SURFACE HEAT ANOMALY</text>
      <text x="0" y="36" fill="#18C8C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">-1.8 °C <tspan fill="#18C8C8" font-size="12">(Cooling Benefit)</tspan></text>
      <rect x="220" y="20" width="100" height="18" rx="9" fill="rgba(24,200,200,0.15)"/>
      <text x="270" y="33" text-anchor="middle" fill="#18C8C8" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">SIMULATED</text>
    </g>

    <!-- Metric 3: Water Deficit -->
    <g transform="translate(20, 156)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">AQUIFER RECHARGE POTENTIAL</text>
      <text x="0" y="36" fill="#4FA8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">+22.5% <tspan fill="#4FA8FF" font-size="12">(Recharge Rate)</tspan></text>
      <rect x="220" y="20" width="100" height="18" rx="9" fill="rgba(79,168,255,0.15)"/>
      <text x="270" y="33" text-anchor="middle" fill="#4FA8FF" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">ESTIMATED</text>
    </g>

    <!-- Metric 4: Ecological Resilience -->
    <g transform="translate(20, 210)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">BIODIVERSITY RECOVERY COEFFICIENT</text>
      <text x="0" y="36" fill="#9B7CFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">0.82 <tspan fill="#9B7CFF" font-size="12">(High Resilience)</tspan></text>
      <rect x="220" y="20" width="100" height="18" rx="9" fill="rgba(155,124,255,0.15)"/>
      <text x="270" y="33" text-anchor="middle" fill="#9B7CFF" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700">MODELLED</text>
    </g>
  </g>
</svg>

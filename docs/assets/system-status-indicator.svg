<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 40" width="340" height="40">
  <defs>
    <linearGradient id="beaconBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071E33"/>
      <stop offset="100%" stop-color="#0B2742"/>
    </linearGradient>
  </defs>
  
  <rect width="340" height="40" rx="20" fill="url(#beaconBg)" stroke="rgba(24,200,200,0.3)" stroke-width="1.2"/>
  
  <!-- Pulsing Radar Beacon Dot -->
  <g transform="translate(24, 20)">
    <circle cx="0" cy="0" r="10" fill="rgba(39,201,138,0.2)">
      <animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#27C98A"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Status Text -->
  <text x="44" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    EARTHMIND <tspan fill="#27C98A">ONLINE</tspan>
  </text>
  
  <line x1="175" y1="12" x2="175" y2="28" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <text x="188" y="24" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="0.5">
    TELEMETRY: <tspan fill="#18C8C8">NOMINAL</tspan>
  </text>
</svg>
